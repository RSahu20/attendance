[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "attendance-intelligence"
version = "0.1.0"
description = "Enterprise RAG attendance intelligence foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<0.116",
  "openpyxl>=3.1,<4.0",
  "openai>=1.60,<2.0",
  "pdf2image>=1.17,<2.0",
  "pgvector>=0.3,<1.0",
  "Pillow>=11.0,<12.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.10,<3.0",
  "PyJWT>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.1,<6.0",
  "pytesseract>=0.3.13,<0.4",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.18,<1.0",
  "reportlab>=4.2,<5.0",
  "sqlalchemy>=2.0,<3.0",
  "sentence-transformers>=3.3,<4.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/attendance"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL database with pgvector",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
