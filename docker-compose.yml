services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_APP_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    command: ["sh", "-c", "alembic upgrade head && uvicorn attendance.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - attendance_files:/data/attendance
      - embedding_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  attendance_files:
  embedding_cache:
